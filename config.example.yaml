# =====================================================================
# YiDesk 配置（命名含义见 README「关于 YiDesk」）
# 复制为 config.yaml 后修改；修改后重启服务生效。
# =====================================================================

app_name: "YiDesk"
host: "0.0.0.0"
port: 8300

# 对外可访问的基础地址（IM 通知卡片里「查看工单」的跳转地址；
# 二维码贴纸里的扫码链接也用它：{public_base_url}/qr/{code}。
# 部署到内网服务器后改成实际 IP 或域名，如 http://192.168.1.100:8300——
# 注意：改了此地址需要重新打印贴纸，上线前先定好）
public_base_url: "http://127.0.0.1:8300"

# 数据库：留空使用 SQLite（backend/data/helpdesk.db）。
# 迁移 MySQL 示例（需 pip install pymysql）：
#   database_url: "mysql+pymysql://user:password@127.0.0.1:3306/itops_helpdesk?charset=utf8mb4"
database_url: ""

# JWT 密钥：务必改成随机长字符串（也可用环境变量 ITOPS_JWT_SECRET 覆盖）
jwt_secret: "please-change-me-to-a-long-random-string"
jwt_expire_minutes: 720

# 旧版全局安全密钥（已废弃）：密钥现按账号管理（系统设置→用户管理→密钥按钮自助生成），
# 本项仅为旧配置迁移兼容保留，保持留空即可。详见 README「后台访问安全密钥」章节。
gate_key: ""

# 首次启动自动创建的管理员账号（登录后请立即修改密码；
# 也可用环境变量 ITOPS_ADMIN_PASSWORD 覆盖）
admin_username: "admin"
admin_password: "admin123"
admin_name: "系统管理员"

# 工单分类（顺序即前端下拉顺序）
categories: ["软件安装", "账号权限", "硬件设备", "打印设备", "网络故障", "其他问题"]

# ---------------------------------------------------------------------
# 钉钉（企业内部应用；Stream 模式收消息，免公网回调）
# 开通步骤见 README「三平台接入指引」
# ---------------------------------------------------------------------
dingtalk:
  enabled: false
  client_id: ""        # 应用凭据 AppKey（即 client_id）
  client_secret: ""    # 应用凭据 AppSecret
  robot_code: ""       # 机器人编码，留空默认取 client_id
  agent_id: 0          # 应用的 AgentId（发「工作通知」必需，开发者后台-应用信息页可查）

# ---------------------------------------------------------------------
# 飞书（企业自建应用；WebSocket 长连接收消息，免公网回调）
# ---------------------------------------------------------------------
feishu:
  enabled: false
  app_id: ""
  app_secret: ""

# ---------------------------------------------------------------------
# 企业微信（自建应用；应用消息推送免公网，接收回调需公网 HTTPS）
# ---------------------------------------------------------------------
wecom:
  enabled: false
  corp_id: ""            # 企业 ID（我的企业-企业信息页）
  agent_id: 1000002      # 自建应用的 AgentId
  corp_secret: ""        # 自建应用的 Secret
  # 接收回调（员工在企微里发消息建单、卡片交互）：
  # 需公网可达的 HTTPS 地址，纯内网配合 frp 等穿透后开启
  callback_enabled: false
  callback_token: ""
  callback_encoding_aes_key: ""

# ---------------------------------------------------------------------
# SLA 时限（分钟）：此处为首启默认值，之后在管理台「系统设置-SLA 规则」调整
# ---------------------------------------------------------------------
sla:
  low:    { response_minutes: 480, resolve_minutes: 2880 }
  medium: { response_minutes: 120, resolve_minutes: 960 }
  high:   { response_minutes: 30,  resolve_minutes: 240 }
  urgent: { response_minutes: 10,  resolve_minutes: 60 }
  # 工作日历（可选）：enabled=true 时 SLA 按工作时间推进；workdays 0=周一…6=周日
  work_hours:
    enabled: false
    start: "09:00"
    end: "18:00"
    workdays: [0, 1, 2, 3, 4]

# ---------------------------------------------------------------------
# 软件许可台账：到期预警（每日 09:30 扫描）
# ---------------------------------------------------------------------
licenses:
  alert_days: 30   # 距到期 N 天内提醒

# ---------------------------------------------------------------------
# 智能派单：建单后自动指派工程师
#   sticky_same_category: 同分类工单优先派给当前持有该类单最多的工程师（粘性），
#                         仅在「分类规则 ∪ 当日值班」池内生效，不会绕过分类规则
#   max_open: 处理人未结工单上限；粘性选中者超过此数则回退轮询
#   mode: round_robin 轮询 | weighted 算法派单（负载+绩效加权打分，v2.1）
#   weights: weighted 模式权重（完结率/速度/满意度加分，未结/被催/重开减分）
#   window_days / min_samples: 绩效统计窗口与最少样本（样本不足退回轮询）
# ---------------------------------------------------------------------
dispatch:
  auto_assign: true
  sticky_same_category: true
  max_open: 8
  mode: round_robin
  weights: { close: 3, speed: 2, sat: 2, load: 2, urge: 1, reopen: 1 }
  window_days: 90
  min_samples: 5
  # v2.4 分派按岗位路由：分类 → 岗位（remote 远程运维 / field 现场运维）。
  # 映射未覆盖的分类不限制岗位；岗位过滤后无候选人时回退不限岗位
  ops_type_map:
    软件安装: remote
    账号权限: remote
    网络故障: field
    硬件设备: field
    打印设备: field
  # 扫码建单（位置码/设备码）默认岗位：field 现场运维；空则按 ops_type_map 分类映射
  qr_ops_type: field
    硬件设备: field
    打印设备: field


# ---------------------------------------------------------------------
# 网络设备台账：定时连通性探活（TCP 探测管理端口）
# ---------------------------------------------------------------------
network:
  probe_enabled: false       # 内网按需开启
  probe_interval_seconds: 300
  probe_timeout_seconds: 2

# ---------------------------------------------------------------------
# 终端合规巡检：代理脚本上报凭据（留空禁用上报接口）
# 生成：python3 -c "import secrets;print(secrets.token_urlsafe(32))"
# ---------------------------------------------------------------------
compliance:
  agent_api_key: ""

# ---------------------------------------------------------------------
# Webhook（v2.2）：工单事件推送到外部系统
#   默认仅 https 且拒绝解析到内网的地址（SSRF 防护）；
#   ITSM/CRM 多在内网，需要时放开 allow_private_network
# ---------------------------------------------------------------------
webhook:
  allow_private_network: false

# ---------------------------------------------------------------------
# AD 域操作联动（v2.2）：审批通过 → 生成任务 → 域内代理机（AdJobRunner.ps1）执行
#   enabled 开启后模板可配 AD 脚本；api_key 为代理机拉取/回传令牌
#   （留空复用 compliance.agent_api_key）
# ---------------------------------------------------------------------
ad_integration:
  enabled: false
  api_key: ""
  timeout_seconds: 600
